# Deploys the site to the preview subdomain new.studio-key.co.uk over FTPS on every push to the
# default branch, or on demand (Actions tab > Deploy preview > Run workflow, pick any branch).
# The preview is noindexed automatically: app/config.php switches to dev on the new. host.
#
# Repository secrets (Settings > Secrets and variables > Actions):
#   FTP_SERVER    e.g. ftp.studio-key.co.uk
#   FTP_USERNAME  a cPanel FTP account limited to the new.studio-key.co.uk folder
#   FTP_PASSWORD
# Optional repository variables:
#   FTP_PROTOCOL  ftps (default) or ftp if the server has no TLS on FTP
#   FTP_DIR       remote folder, default ./ (the FTP account's home)
#
# Only files this workflow uploaded are ever removed from the server. app/secrets.php,
# storage/app.key and saved leads are never touched.

name: Deploy preview

on:
  push:
    branches: [claude/amazing-lovelace-3wferc]
    paths-ignore: ['docs/**', '**/*.md', '.claude/**']
  workflow_dispatch:

concurrency:
  group: deploy-preview
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check FTP secrets are set
        id: secrets
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          if [ -z "$FTP_SERVER" ] || [ -z "$FTP_USERNAME" ] || [ -z "$FTP_PASSWORD" ]; then
            echo "::warning::Skipping deploy: add FTP_SERVER, FTP_USERNAME and FTP_PASSWORD under Settings > Secrets and variables > Actions."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.secrets.outputs.ready == 'true'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Check PHP syntax
        if: steps.secrets.outputs.ready == 'true'
        run: find app public -name '*.php' -print0 | xargs -0 -n1 php -l > /dev/null

      - name: Upload changed files
        if: steps.secrets.outputs.ready == 'true'
        uses: SamKirkland/FTP-Deploy-Action@8e83cea8672e3fbcbb9fdafff34debf6ae4c5f65 # v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ${{ vars.FTP_PROTOCOL || 'ftps' }}
          server-dir: ${{ vars.FTP_DIR || './' }}
          exclude: |
            **/.git/**
            .gitignore
            .github/**
            .claude/**
            docs/**
            **/*.md
            skills-lock.json
