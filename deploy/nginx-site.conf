# Studio Key: Nginx snippets for the CloudPanel vhost (Vhost Editor).
# Set the site's document root to .../public so app/, storage/, docs/ and deploy/ are never web-reachable.
# Merge these into the existing server { } block; keep CloudPanel's own PHP-FPM and SSL lines.

# --- Compression (PHP also compresses if this is missing) ---
gzip on;
gzip_comp_level 6;
gzip_min_length 1024;
gzip_types text/plain text/css application/javascript application/json image/svg+xml application/manifest+json text/xml application/xml;

# --- Pretty URLs: /pricing -> /pricing/ ---
location ~ ^/(pricing|about|contact|privacy|terms)$ { return 301 /$1/; }

# --- Old site redirects (fill in deploy/redirects.conf, then include it) ---
# include /home/<site-user>/htdocs/www.studio-key.co.uk/deploy/redirects.conf;

# --- Block dotfiles except .well-known ---
location ~ /\.(?!well-known/) { deny all; return 404; }

# --- Never serve source or private files even if the web root is wrong ---
location ~ ^/(app|storage|docs|deploy|\.git)/ { deny all; return 404; }
location ~ \.(md|lock|log|jsonl|key|example\.php)$ { deny all; return 404; }

# --- Long cache for versioned assets (asset() adds ?v=hash) ---
location /assets/ {
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options "nosniff";
    access_log off;
    try_files $uri =404;
}
location ~* ^/(favicon\.ico|favicon\.svg|apple-touch-icon\.png|icon-.*\.png|site\.webmanifest)$ {
    expires 7d;
    add_header Cache-Control "public, max-age=604800";
    access_log off;
}

# --- Front controller per folder, friendly 404 ---
location / { try_files $uri $uri/index.php =404; }
error_page 404 /404.php;

# --- Only the API endpoint accepts POST ---
location = /api/enquiry.php {
    limit_except POST GET { deny all; }
    # CloudPanel's PHP-FPM block handles execution.
}

# Security headers are sent by app/bootstrap.php for PHP pages. Static files get these:
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

